# Lint and format settings. Deliberately not a pyproject.toml: this is a script with inline dependencies, not a project.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ASYNC", "S", "PLE", "RUF"]
ignore = [
    "S101",    # assert is fine in tests
    "S104",    # the UDP responder binds 0.0.0.0 on purpose and filters by source address
    "S603", "S607",  # subprocess with a fixed argument list
    "SIM105",  # try/except/pass is sometimes clearer than suppress
    "RET505",
    "UP041",   # asyncio.TimeoutError reads clearer next to asyncio.wait_for
    "ASYNC109",  # functions that take a timeout and pass it on
    "RUF012",
]

[lint.per-file-ignores]
# the store assembles queries from its own constant fragments; every value is a bound parameter
"bchan/store.py" = ["S608"]
"tests/*" = ["S", "B011", "ASYNC"]
