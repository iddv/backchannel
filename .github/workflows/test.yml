name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the lockfile is current
        run: uv lock --check
      - name: Lint
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: End-to-end and attack tests
        run: uv run --locked pytest
      - name: The package builds
        run: uv build
        env:
          BACKCHANNEL_BIND: private
