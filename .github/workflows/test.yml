name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the lockfile is current
        run: uv lock --script backchannel.py --check
      - name: End-to-end and attack tests
        run: uv run --no-project --no-config --locked --script tests/e2e.py
        env:
          BACKCHANNEL_BIND: private
